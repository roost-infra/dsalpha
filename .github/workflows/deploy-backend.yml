name: deploy-backend

# The production container mounts the source tree from /opt/langalpha, so a
# backend deploy is: snapshot the tree, extract the built source over it,
# restart the service and check /health. The runtime image is not rebuilt here:
# a change to pyproject.toml/uv.lock needs an image first, so those changes are
# refused below instead of shipping code the image's venv cannot import.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - server.py
      - scripts/**
      - libs/**
      - mcp_servers/**
      - plugins/**
      - workflows/**
      - migrations/**
      - alembic.ini
      - pyproject.toml
      - uv.lock
      - deploy/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:
    inputs:
      image_rebuilt:
        description: "The runtime image was rebuilt for this tree (Dockerfile/dependency change)"
        type: boolean
        default: false

concurrency:
  group: deploy-dslpha-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Refuse dependency changes without an image rebuild
        env:
          IMAGE_REBUILT: ${{ inputs.image_rebuilt }}
        run: |
          if [ "${IMAGE_REBUILT:-false}" != "true" ] && \
             git diff --name-only HEAD^ HEAD | grep -qE '^(pyproject\.toml|uv\.lock|deploy/Dockerfile\.backend)$'; then
            echo "::error::dependency or image inputs changed; the runtime image must be rebuilt before this tree can run"
            exit 1
          fi
      - name: Package source tree
        run: |
          mkdir -p build
          tar -czf build/backend-src.tgz \
            src server.py scripts libs mcp_servers plugins workflows migrations \
            alembic.ini pyproject.toml uv.lock
      - uses: actions/upload-artifact@v4
        with:
          name: backend-src
          path: build/backend-src.tgz
          retention-days: 3

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload source tree
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -q -i ~/.ssh/deploy -o UserKnownHostsFile=~/.ssh/known_hosts \
            build/backend-src.tgz "$USER@$HOST:/tmp/dsalpha-src-${{ github.sha }}.tgz"
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy -o UserKnownHostsFile=~/.ssh/known_hosts "$USER@$HOST" "bash -s -- $SHA" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          TS=$(date +%Y%m%d-%H%M%S)
          cd /opt/langalpha
          mkdir -p .deploy-snapshots
          SNAP=".deploy-snapshots/backend-$TS.tgz"

          tar -czf "$SNAP" src server.py scripts libs mcp_servers plugins workflows migrations \
            alembic.ini pyproject.toml uv.lock
          tar -xzf "/tmp/dsalpha-src-$SHA.tgz" -C .
          sudo -n /usr/local/bin/langalpha-backend-restart

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::backend health check failed; restoring the previous tree"
            tar -xzf "$SNAP" -C .
            sudo -n /usr/local/bin/langalpha-backend-restart || true
            exit 1
          fi

          ( ls -1dt .deploy-snapshots/backend-*.tgz | tail -n +4 | xargs -r rm -f -- ) || true
          rm -f "/tmp/dsalpha-src-$SHA.tgz"
          echo "backend deployed ($SHA)"
          REMOTE
      - name: Verify the public app
        run: |
          curl -fsS -o /dev/null https://dsalpha.roostbots.com/chat
