name: ops-backend

# One-off operator job: inspect (and optionally repair) the production backend
# when the normal deploy reports success but the running app did not pick up the
# new source tree. Manual only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose prints the state; fix recreates the backend container"
        type: choice
        options: [diagnose, fix]
        default: diagnose

concurrency:
  group: ops-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Run on the app host
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          ssh -i ~/.ssh/deploy -o UserKnownHostsFile=~/.ssh/known_hosts "$USER@$HOST" "bash -s -- '$MODE'" <<'REMOTE'
          set -uo pipefail
          MODE="$1"
          cd /opt/langalpha

          echo "=== host ==="
          pwd
          id
          ls -la docker-compose*.yml .env 2>&1 || true
          ls -la src/server/app/guest_dm.py 2>&1 || true
          grep -n "guest_dm" src/server/app/setup.py 2>&1 || true

          echo "=== sudo permissions ==="
          sudo -n -l 2>&1 || true

          echo "=== paths and permissions ==="
          for d in /opt/langalpha /opt/langalpha/src /opt/langalpha/deploy /opt/langalpha/migrations /var/run/docker28; do
            ls -ld "$d" 2>&1 || true
          done
          for f in /usr/local/bin/langalpha-backend-restart /usr/local/bin/docker; do
            ls -l "$f" 2>&1 || true
          done
          [ -w /opt/langalpha ] && echo "dir /opt/langalpha: writable" || echo "dir /opt/langalpha: not writable"
          [ -w /usr/local/bin/langalpha-backend-restart ] && echo "restart script: writable" || echo "restart script: not writable"

          echo "=== docker socket access ==="
          SOCK=unix:///var/run/docker28/docker.sock
          ls -la /var/run/docker28/docker.sock /var/run/docker.sock 2>&1 || true
          if DOCKER_HOST=$SOCK docker ps >/dev/null 2>&1; then
            echo "docker28: accessible as $(id -un)"
            DOCKER_HOST=$SOCK docker ps -a --format '{{.ID}}|{{.Names}}|{{.Image}}|{{.Status}}' | grep -i langalpha || true
            DOCKER_HOST=$SOCK docker inspect langalpha-backend-1 --format '{{json .Config.Labels}}' 2>&1 || true
            DOCKER_HOST=$SOCK docker inspect langalpha-backend-1 --format '{{json .Mounts}}' 2>&1 || true
          else
            echo "docker28: not accessible (sudo only)"
          fi

          echo "=== docker access ==="
          DC=docker
          if ! docker ps >/dev/null 2>&1; then DC="sudo -n docker"; fi
          echo "engine: $DC"
          $DC version --format '{{.Server.Version}}' 2>&1 || true

          echo "=== compose projects ==="
          $DC compose ls 2>&1 || true

          echo "=== containers ==="
          $DC ps -a --format '{{.ID}}|{{.Names}}|{{.Image}}|{{.Status}}' 2>&1 | grep -i langalpha || true

          echo "=== restart script ==="
          cat /usr/local/bin/langalpha-backend-restart 2>&1 || true

          echo "=== compose files ==="
          for f in docker-compose.yml docker-compose.override.yml docker-compose.sg.yml; do
            echo "--- $f ---"
            cat "$f" 2>&1 || true
          done

          echo "=== server processes ==="
          ps -ef | grep -E "server\.py|uvicorn" | grep -v grep | head -10 || true

          echo "=== port 8000 ==="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':8000\b' || true

          echo "=== backend mounts ==="
          for n in $($DC ps -a --format '{{.Names}}' 2>/dev/null | grep 'langalpha-backend' || true); do
            echo "-- $n"
            $DC inspect "$n" --format '{{json .Mounts}}' 2>&1 || true
            $DC inspect "$n" --format '{{.Config.Image}}' 2>&1 || true
          done

          if [ "$MODE" = "fix" ]; then
            echo "=== fix: recreate backend ==="
            echo "restart script:"
            # The running container predates the current compose project labels,
            # so compose tries to create a second container and hits the name
            # conflict. The deploy user owns /opt/langalpha, so stage a compose
            # file that removes that orphan first and then recreates backend from
            # the same source/mounts. Remove it again once the probe is green.
            if [ -f compose.yaml ]; then
              mv -f compose.yaml "compose.yaml.bak.$(date +%s)"
            fi
            cat > compose.yaml <<'YAML'
          name: langalpha
          include:
            - path: docker-compose.yml
            - path: docker-compose.override.yml
          services:
            fixer:
              image: docker:28-cli
              volumes:
                - /var/run/docker28/docker.sock:/var/run/docker.sock
              command: ["sh", "-c", "docker rm -f langalpha-backend-1 || true"]
            backend:
              depends_on:
                fixer:
                  condition: service_completed_successfully
          YAML
            sudo -n /usr/local/bin/langalpha-backend-restart 2>&1 || echo "restart failed"
            for _ in $(seq 1 30); do
              if curl -fsS -m 3 http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
              sleep 2
            done
            echo "=== local route probe (401 expected; 404 means old code) ==="
            DM=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/dm/contacts 2>/dev/null || true)
            BOTS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/bots 2>/dev/null || true)
            echo "dm=$DM bots=$BOTS"
            if [ "$DM" = "401" ]; then
              echo "backend refreshed; removing the staged compose.yaml"
              rm -f compose.yaml
            else
              echo "refresh did not take; restoring the normal compose path"
              rm -f compose.yaml
              sudo -n /usr/local/bin/langalpha-backend-restart 2>&1 || true
            fi
          fi
          REMOTE
