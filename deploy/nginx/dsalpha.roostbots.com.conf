map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name dsalpha.roostbots.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dsalpha.roostbots.com;

    ssl_certificate /etc/nginx/ssl/dsalpha.roostbots.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dsalpha.roostbots.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Static-file throughput and metadata caching.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    root /opt/langalpha/web/dist;

    # Roost Relay (OpenAI-compatible model gateway).
    location /relay/ {
        proxy_pass http://127.0.0.1:8788/;
        gzip off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        client_max_body_size 4m;
    }
    index index.html;
    client_max_body_size 200m;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Public front door. The product SPA owns /app; / and its landing assets
    # are served from the static site beside the built app.
    location = / {
        root /opt/langalpha/web/landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /landing {
        return 301 /landing/;
    }

    location /landing/ {
        alias /opt/langalpha/web/landing/;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /assets/index-BR8QdIyy.js { return 302 /assets/index-DESjoDFv.js; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Conversation replay is a finite SSE stream that can be hundreds of KB;
    # buffer it so the gzip filter can compress the whole response, then send
    # it as one compressed body. The live turn stream stays unbuffered below.
    location ~ ^/api/v1/threads/[^/]+/messages/replay$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        gzip on;
        gzip_proxied any;
        gzip_types text/event-stream application/json;
        proxy_read_timeout 3600s;
    }

    location /console-api/ {
        proxy_pass https://www.roostbots.com/console-api/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.roostbots.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        gzip off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /sb/ {
        proxy_pass https://veysvzfcyjxxbhvcfhuv.supabase.co/;
        proxy_ssl_server_name on;
        proxy_ssl_name veysvzfcyjxxbhvcfhuv.supabase.co;
        proxy_set_header Host veysvzfcyjxxbhvcfhuv.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Roost market API — only the official site reverse proxy may call this.
    location /roost-api/ {
        allow 127.0.0.1;
        allow 47.82.164.116;
        deny all;
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }


    # Desktop/VNC WebSocket (and any other upgraded stream outside /api/).
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
