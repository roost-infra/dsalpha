<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - dsalpha 额度管理</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
         background: #f6f7f9; color: #1b1d25; }
  form { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
         padding: 28px; width: 320px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: #6b7280; font-size: 12px; }
  input { font: inherit; padding: 8px 10px; border: 1px solid #d1d5db;
          border-radius: 8px; }
  button { background: #1b1d25; color: #fff; border: 0; border-radius: 8px;
           padding: 9px 14px; cursor: pointer; }
  .error { color: #b42318; font-size: 12px; }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <h1>dsalpha 额度管理</h1>
  <p class="muted">输入 ADMIN_TOKEN 登录</p>
  <input type="password" name="token" placeholder="ADMIN_TOKEN" autofocus required>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">登录</button>
</form>
</body>
</html>
